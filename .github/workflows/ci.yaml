name: Docker build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI_IMAGE: sentinel-1-stack:ci
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build image
        timeout-minutes: 40
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ci
          docker build --platform linux/amd64 --progress plain \
            --build-arg BUILD_JOBS=2 -t "$CI_IMAGE" . 2>&1 | tee build/ci/build.log
      - name: Check runtime and repeated tests
        timeout-minutes: 15
        run: python3 scripts/check_ci.py --image "$CI_IMAGE" --output build/ci/checks
      - name: Save logs and package inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-amd64-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci/
          if-no-files-found: warn
          retention-days: 14
