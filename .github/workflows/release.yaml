name: Build and distribute image

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]
          version="${GITHUB_REF_NAME#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_IMAGE=sentinel-1-stack:$version" >> "$GITHUB_ENV"
      - name: Build image
        timeout-minutes: 40
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/release
          docker build --platform linux/amd64 --progress plain --build-arg BUILD_JOBS=2 \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.title=sentinel-1-stack" \
            --label "org.opencontainers.image.licenses=" \
            -t "$RELEASE_IMAGE" . 2>&1 | tee build/release/build.log
      - name: Check runtime and repeated tests
        timeout-minutes: 15
        run: python3 scripts/check_ci.py --image "$RELEASE_IMAGE" --output build/release/checks
      - name: Package image and matching source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release
          image_archive="dist/release/sentinel-1-stack-$VERSION-linux-amd64.tar.gz"
          docker save "$RELEASE_IMAGE" | gzip -1 > "$image_archive"
          gzip -t "$image_archive"
          test "$(stat -c %s "$image_archive")" -lt 2000000000
          original_id="$(docker image inspect "$RELEASE_IMAGE" --format '{{.Id}}')"
          docker load -i "$image_archive"
          test "$original_id" = "$(docker image inspect "$RELEASE_IMAGE" --format '{{.Id}}')"
          git archive --format=tar.gz --prefix="sentinel-1-stack-$VERSION/" \
            -o "dist/release/sentinel-1-stack-$VERSION-source.tar.gz" HEAD
          docker image inspect "$RELEASE_IMAGE" > dist/release/image-inspect.json
          tar -czf dist/release/validation.tar.gz -C build/release checks build.log
          cp docs/distribution.md dist/release/README.md
          cd dist/release
          sha256sum *.tar.gz image-inspect.json README.md > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$VERSION" == *-rc* ]]; then args+=(--prerelease); fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Explicitly authorized rc4 refresh; other published versions stay immutable.
            test "$VERSION" = "0.1.0-rc4"
            # Hide the release while replacing the complete, already verified asset set.
            gh release edit "$GITHUB_REF_NAME" --draft=true
            gh release upload "$GITHUB_REF_NAME" dist/release/* --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease \
              --title "sentinel-1-stack $VERSION (2026-09-22 update)" \
              --notes-file docs/distribution.md
          else
            gh release create "$GITHUB_REF_NAME" dist/release/* --verify-tag \
              --title "sentinel-1-stack $VERSION" "${args[@]}" \
              --notes-file docs/distribution.md
          fi
      - name: Save build and validation logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/release/
          if-no-files-found: warn
          retention-days: 14
